<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>爱心</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas" width="640" height="480"></canvas>
    <script>
        const CANVAS_WIDTH = 640;
        const CANVAS_HEIGHT = 480;
        const CANVAS_CENTER_X = CANVAS_WIDTH / 2;
        const CANVAS_CENTER_Y = CANVAS_HEIGHT / 2;
        const IMAGE_ENLARGE = 11;
        const HEART_COLOR = "#FF69B4";

        function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            x *= shrinkRatio;
            y *= shrinkRatio;
            x += CANVAS_CENTER_X;
            y += CANVAS_CENTER_Y;
            return [Math.floor(x), Math.floor(y)];
        }

        function scatterInside(x, y, beta = 0.15) {
            const ratioX = -beta * Math.log(Math.random());
            const ratioY = -beta * Math.log(Math.random());
            const dx = ratioX * (x - CANVAS_CENTER_X);
            const dy = ratioY * (y - CANVAS_CENTER_Y);
            return [x - dx, y - dy];
        }

        function shrink(x, y, ratio) {
            const force = -1 / Math.pow((Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2)), 0.6);
            const dx = ratio * force * (x - CANVAS_CENTER_X);
            const dy = ratio * force * (y - CANVAS_CENTER_Y);
            return [x - dx, y - dy];
        }

        function curve(p) {
            return 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);
        }

        class Heart {
            constructor(generateFrame = 20) {
                this._points = new Set();
                this._edgeDiffusionPoints = new Set();
                this._centerDiffusionPoints = new Set();
                this.allPoints = {};
                this.generateFrame = generateFrame;
                this.build(2000);
                for (let frame = 0; frame < generateFrame; frame++) {
                    this.calc(frame);
                }
            }

            build(number) {
                for (let i = 0; i < number; i++) {
                    const t = Math.random() * 2 * Math.PI;
                    const [x, y] = heartFunction(t);
                    this._points.add(`${x},${y}`);
                }
                for (const point of this._points) {
                    const [_x, _y] = point.split(',').map(Number);
                    for (let i = 0; i < 3; i++) {
                        const [x, y] = scatterInside(_x, _y, 0.05);
                        this._edgeDiffusionPoints.add(`${x},${y}`);
                    }
                }
                const pointList = Array.from(this._points);
                for (let i = 0; i < 6000; i++) {
                    const randomPoint = pointList[Math.floor(Math.random() * pointList.length)];
                    const [px, py] = randomPoint.split(',').map(Number);
                    const [x, y] = scatterInside(px, py, 0.17);
                    this._centerDiffusionPoints.add(`${x},${y}`);
                }
            }

            calcPosition(x, y, ratio) {
                const force = 1 / Math.pow((Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2)), 0.520);
                const dx = ratio * force * (x - CANVAS_CENTER_X) + Math.floor(Math.random() * 3) - 1;
                const dy = ratio * force * (y - CANVAS_CENTER_Y) + Math.floor(Math.random() * 3) - 1;
                return [x - dx, y - dy];
            }

            calc(generateFrame) {
                const ratio = 10 * curve(generateFrame / 10 * Math.PI);
                const haloRadius = Math.floor(4 + 6 * (1 + curve(generateFrame / 10 * Math.PI)));
                const haloNumber = Math.floor(3000 + 4000 * Math.pow(Math.abs(curve(generateFrame / 10 * Math.PI)), 2));
                const allPoints = [];
                const heartHaloPoint = new Set();

                for (let i = 0; i < haloNumber; i++) {
                    const t = Math.random() * 4 * Math.PI;
                    let [x, y] = heartFunction(t, 11.5);
                    [x, y] = shrink(x, y, haloRadius);
                    const key = `${x},${y}`;
                    if (!heartHaloPoint.has(key)) {
                        heartHaloPoint.add(key);
                        x += Math.floor(Math.random() * 29) - 14;
                        y += Math.floor(Math.random() * 29) - 14;
                        const size = [1, 2, 2][Math.floor(Math.random() * 3)];
                        allPoints.push([x, y, size]);
                    }
                }

                for (const point of this._points) {
                    let [x, y] = point.split(',').map(Number);
                    [x, y] = this.calcPosition(x, y, ratio);
                    const size = Math.floor(Math.random() * 3) + 1;
                    allPoints.push([x, y, size]);
                }

                for (const point of this._edgeDiffusionPoints) {
                    let [x, y] = point.split(',').map(Number);
                    [x, y] = this.calcPosition(x, y, ratio);
                    const size = Math.floor(Math.random() * 2) + 1;
                    allPoints.push([x, y, size]);
                }

                for (const point of this._centerDiffusionPoints) {
                    let [x, y] = point.split(',').map(Number);
                    [x, y] = this.calcPosition(x, y, ratio);
                    const size = Math.floor(Math.random() * 2) + 1;
                    allPoints.push([x, y, size]);
                }

                this.allPoints[generateFrame] = allPoints;
            }

            render(ctx, renderFrame) {
                ctx.fillStyle = HEART_COLOR;
                for (const [x, y, size] of this.allPoints[renderFrame % this.generateFrame]) {
                    ctx.fillRect(x, y, size, size);
                }
            }
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const heart = new Heart();
        let frame = 0;

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            heart.render(ctx, frame);
            frame++;
            setTimeout(draw, 160);
        }

        draw();
    </script>
</body>
</html>
